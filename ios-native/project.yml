name: VRPlayer
options:
  bundleIdPrefix: com.vrplayer
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '15.0'

settings:
  base:
    PRODUCT_NAME: VRPlayer
    PRODUCT_BUNDLE_IDENTIFIER: com.vrplayer.native
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_BITCODE: NO

targets:
  VRPlayer:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vrplayer.native
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
